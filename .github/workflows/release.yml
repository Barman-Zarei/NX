# Release pipeline (NOT YET RUN). Needs repository secrets NX_GPG_PRIVATE_KEY (armored, passphrase-protected) and NX_GPG_PASSPHRASE.
# No key is stored in this repository. Tags like v0.1.0-beta.1 are published as pre-releases; only tags without '-' are stable.
name: release
on:
  push:
    tags: ['v*']
concurrency:
  group: "release-${{ github.ref_name }}"
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag format (vMAJOR.MINOR.PATCH[-suffix])
        run: echo "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
      - name: Pre-release tests (Code Studio + unit + compatibility DB)
        run: |
          sudo apt-get update && sudo apt-get install -y git libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 python3-gi gir1.2-gtk-3.0 xvfb
          python3 -m pip install --user --break-system-packages pyyaml PySide6-Essentials
          git config --global user.email ci@example.invalid && git config --global user.name ci
          QT_QPA_PLATFORM=offscreen python3 -m unittest discover -s code-studio/tests
          xvfb-run -a python3 -m unittest discover -s tests/unit -p 'test_*.py'
          python3 compatibility/validate.py
      - run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            mtools dosfstools parted gdisk ntfs-3g qemu-system-x86 ovmf gnupg
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Make dpkg non-interactive (keep existing conffiles, e.g. casper.conf)
        run: |
          sed -i 's/apt-get install -y /apt-get install -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold /' build/build-iso.sh
          grep -q 'force-confold' build/build-iso.sh
      - name: Build ISO
        run: sudo -E NX_VERSION="${GITHUB_REF_NAME#v}" build/build-iso.sh
        env: { DEBIAN_FRONTEND: noninteractive, DEBCONF_NONINTERACTIVE_SEEN: "true" }
      - name: Take ownership of out/ (created by root; the runner user must write SHA256SUMS and the signature there)
        run: sudo chown -R "$(id -u):$(id -g)" out && (cd out && sha256sum -c *.sha256)
      - run: tests/vm/boot-test.sh out/nx-os-*-amd64.iso 1500 && tests/vm/boot-test-uefi.sh out/nx-os-*-amd64.iso 1500
      - run: sudo tests/vm/test-installers.sh out/nx-os-*-amd64.iso all
      - name: Verify the image is a real ISO 9660 with boot metadata
        run: |
          f=$(ls out/nx-os-*-amd64.iso); file "$f" | grep -q 'ISO 9660'; xorriso -indev "$f" -report_el_torito plain 2>&1 | grep -q 'El Torito'
      - name: Manifest (package list = SBOM-lite) and SHA256SUMS
        run: |
          sudo chroot /var/tmp/nx-build/chroot dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' | sudo tee out/nx-packages.tsv >/dev/null
          cd out && sha256sum *.iso nx-packages.tsv > SHA256SUMS
      - name: Sign SHA256SUMS (detached GPG) and verify the signature
        env: { KEY: "${{ secrets.NX_GPG_PRIVATE_KEY }}", PASS: "${{ secrets.NX_GPG_PASSPHRASE }}" }
        run: |
          test -n "$KEY" || { echo "NX_GPG_PRIVATE_KEY secret missing: refusing to publish an unsigned release"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"; echo "$KEY" | gpg --batch --import
          cd out && gpg --batch --pinentry-mode loopback --passphrase "$PASS" --armor --detach-sign SHA256SUMS
          gpg --armor --export > nx-release-key.pub.asc && gpg --verify SHA256SUMS.asc SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
            out/SHA256SUMS.asc
            out/nx-release-key.pub.asc
            out/nx-packages.tsv
          prerelease: ${{ contains(github.ref_name, '-') }}
