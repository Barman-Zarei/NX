# Release pipeline (NOT YET RUN). Needs repository secrets NX_GPG_PRIVATE_KEY (armored, passphrase-protected) and NX_GPG_PASSPHRASE.
# No key is stored in this repository. Tags like v0.1.0-beta.1 are published as pre-releases; only tags without '-' are stable.
name: release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            mtools dosfstools parted gdisk ntfs-3g qemu-system-x86 ovmf gnupg
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - run: sudo NX_VERSION="${GITHUB_REF_NAME#v}" build/build-iso.sh
      - run: sudo chmod -R a+r out && (cd out && sha256sum -c *.sha256)
      - run: tests/vm/boot-test.sh out/nx-os-*-amd64.iso 1500 && tests/vm/boot-test-uefi.sh out/nx-os-*-amd64.iso 1500
      - run: sudo tests/vm/test-installers.sh out/nx-os-*-amd64.iso all
      - name: Manifest (package list = SBOM-lite) and SHA256SUMS
        run: |
          sudo chroot /var/tmp/nx-build/chroot dpkg-query -W -f='${Package}\t${Version}\t${Architecture}\n' | sudo tee out/nx-packages.tsv >/dev/null
          cd out && sha256sum *.iso nx-packages.tsv > SHA256SUMS
      - name: Sign SHA256SUMS (detached GPG) and verify the signature
        env: { KEY: "${{ secrets.NX_GPG_PRIVATE_KEY }}", PASS: "${{ secrets.NX_GPG_PASSPHRASE }}" }
        run: |
          test -n "$KEY" || { echo "NX_GPG_PRIVATE_KEY secret missing: refusing to publish an unsigned release"; exit 1; }
          export GNUPGHOME="$(mktemp -d)"; echo "$KEY" | gpg --batch --import
          cd out && gpg --batch --pinentry-mode loopback --passphrase "$PASS" --armor --detach-sign SHA256SUMS
          gpg --armor --export > nx-release-key.pub.asc && gpg --verify SHA256SUMS.asc SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
            out/SHA256SUMS.asc
            out/nx-release-key.pub.asc
            out/nx-packages.tsv
          prerelease: ${{ contains(github.ref_name, '-') }}
