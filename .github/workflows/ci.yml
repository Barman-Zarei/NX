# NOT YET RUN on GitHub. A green run is not a release: the boot test output must be inspected.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning build/build-iso.sh installer/nx-install installer/nx-install-alongside tests/vm/*.sh
      - run: python3 -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python3 compatibility/validate.py
  iso-and-boot:
    needs: lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin mtools dosfstools qemu-system-x86 ovmf
      - name: Enable KVM if present
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM: tests fall back to slow TCG"
      - run: sudo build/build-iso.sh
      - run: sudo chmod -R a+r out && (cd out && sha256sum -c *.sha256)
      - run: tests/vm/boot-test.sh out/nx-os-*-amd64.iso 1500
      - run: tests/vm/boot-test-uefi.sh out/nx-os-*-amd64.iso 1500
      - uses: actions/upload-artifact@v4
        with: { name: nx-iso, path: out/ }
