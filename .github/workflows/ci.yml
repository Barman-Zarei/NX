# LEGACY branch: only checks the Windows-7-compatible tool (Python 3.8 / PySide2). OS builds and VM tests run on main.
# Written by the NX maintainer tooling. NOT YET RUN on GitHub (first run may need small fixes). A green run is not a release.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 python3-gi gir1.2-gtk-3.0 xvfb
      - run: shellcheck -S warning build/build-iso.sh installer/nx-install installer/nx-install-alongside tests/vm/*.sh
      - name: Unit tests (Python 3.12)
        run: xvfb-run -a python3 -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python3 compatibility/validate.py
      - name: Brok adapter tests against real Brok (runner is non-root)
        run: |
          git clone --depth 1 https://github.com/Barman-Zarei/Brok /tmp/Brok
          NX_BROK_DIR=/tmp/Brok python3 -m unittest tests.unit.test_brok_adapter -v
      - name: Windows-tool stack on Python 3.8 + PySide2 5.15.2.1 (offscreen)
        run: |
          pip install uv && uv venv --python 3.8 /tmp/v38 && uv pip install --python /tmp/v38/bin/python PySide2==5.15.2.1
          /tmp/v38/bin/python -m unittest discover -s tests/unit -p 'test_*.py' -v
