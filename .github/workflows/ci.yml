# Written by the NX maintainer tooling. NOT YET RUN on GitHub (first run may need small fixes). A green run is not a release.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    env: { NX_BROK_DIR: /tmp/Brok }
    steps:
      - uses: actions/checkout@v4
      - name: Get real Brok (adapter tests need it)
        run: git clone --depth 1 https://github.com/Barman-Zarei/Brok /tmp/Brok
      - run: sudo apt-get update && sudo apt-get install -y shellcheck libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 python3-gi gir1.2-gtk-3.0 xvfb
      - run: shellcheck -S warning build/build-iso.sh installer/nx-install installer/nx-install-alongside tests/vm/*.sh
      - name: Unit tests (Python 3.12)
        run: xvfb-run -a python3 -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python3 compatibility/validate.py
      - name: Brok adapter tests against real Brok (runner is non-root)
        run: |
          python3 -m unittest tests.unit.test_brok_adapter -v
      - name: Windows-tool GUI on Python 3.12 + PySide6 (offscreen)
        run: |
          python3 -m pip install --user --break-system-packages uv
          python3 -m uv venv --python 3.12 /tmp/v312
          python3 -m uv pip install --python /tmp/v312/bin/python PySide6-Essentials
          /tmp/v312/bin/python -m unittest tests.unit.test_gui_offscreen -v
  iso-and-vm-tests:
    needs: lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            mtools dosfstools parted gdisk ntfs-3g qemu-system-x86 ovmf
      - name: Enable KVM if present
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || echo "no KVM: tests fall back to slow TCG"
      - name: Make dpkg non-interactive (keep existing conffiles, e.g. casper.conf)
        run: |
          sed -i 's/apt-get install -y /apt-get install -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold /' build/build-iso.sh
          grep -q 'force-confold' build/build-iso.sh
      - name: Build ISO
        run: sudo -E build/build-iso.sh
        env: { DEBIAN_FRONTEND: noninteractive, DEBCONF_NONINTERACTIVE_SEEN: "true" }
      - run: sudo chmod -R a+r out && (cd out && sha256sum -c *.sha256)
      - run: tests/vm/boot-test.sh out/nx-os-*-amd64.iso 1500
      - run: tests/vm/boot-test-uefi.sh out/nx-os-*-amd64.iso 1500
      - name: Installer tests (empty disk, alongside, Secure Boot)
        run: sudo NX_LOG_DIR=$PWD/test-logs tests/vm/test-installers.sh out/nx-os-*-amd64.iso all
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nx-iso-and-logs, path: "out/\ntest-logs/" }
  desktop-flavor:   # builds the XFCE flavor, checks its contents inside the image, boots it graphically and gates on the screenshot
    needs: lint-unit
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            mtools dosfstools parted qemu-system-x86 socat imagemagick python3-pil
      - name: Enable KVM if present
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Make dpkg non-interactive (keep existing conffiles, e.g. casper.conf)
        run: |
          sed -i 's/apt-get install -y /apt-get install -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold /' build/build-iso.sh
          grep -q 'force-confold' build/build-iso.sh
      - name: Build desktop ISO
        run: sudo -E NX_FLAVOR=desktop build/build-iso.sh
        env: { DEBIAN_FRONTEND: noninteractive, DEBCONF_NONINTERACTIVE_SEEN: "true" }
      - name: Image content checks (chroot)
        run: |
          C=/var/tmp/nx-build/chroot
          sudo chroot $C test -x /usr/bin/calamares
          sudo chroot $C test -f /etc/calamares/settings.conf
          sudo chroot $C test -f /opt/brok/LICENSE.txt && sudo chroot $C test -f /opt/brok/NOTICE
          sudo chroot $C python3 -c "import gi; gi.require_version('Gtk','3.0'); from gi.repository import Gtk"
          sudo chroot $C su -s /bin/sh nx -c "NX_BROK_DIR=/opt/brok nx-ai doctor"
          sudo chroot $C su -s /bin/sh nx -c "NX_AI_DISABLED=1 nx-ai ask hi" | grep -q disabled
          sudo chroot $C test -f /usr/share/applications/nx-software.desktop
      - run: sudo chmod -R a+r out && tests/vm/desktop-screenshot.sh out/nx-os-*-desktop-amd64.iso shots 60 6
      - name: Gate - last screenshot must show a real desktop (not black/blank)
        run: |
          python3 - <<'PY'
          import glob
          from PIL import Image
          f = sorted(glob.glob("shots/shot-*.png"))[-1]
          im = Image.open(f).convert("RGB").resize((160, 90))
          n = len(set(im.getdata()))
          print(f, "distinct colours:", n)
          raise SystemExit(0 if n > 40 else 1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: desktop-screenshots, path: shots/ }
