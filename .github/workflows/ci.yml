name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning build/build-iso.sh tests/vm/*.sh
      - run: python3 -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python3 compatibility/validate.py
  # ISO build + VM boot test are run manually (need root); a green workflow is NOT a release.
