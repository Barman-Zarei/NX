# LEGACY branch CI. Targets: Windows 7 SP1+ tool (Python 3.8 / PySide2) and BIOS/MBR dual boot. NOT YET RUN on GitHub.
# GitHub has no Windows 7 runners: Windows 7 itself is covered by (a) static PE compatibility checks, (b) a Wine-in-Windows-7-mode proxy
# and (c) windows/win7-smoke-test.bat that a human runs on a real Windows 7 machine. (a) and (b) are proxies, not proof.
name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  lint-unit:
    runs-on: ubuntu-24.04
    env: { NX_BROK_DIR: /tmp/Brok }
    steps:
      - uses: actions/checkout@v4
      - name: Get real Brok (adapter tests need it)
        run: git clone --depth 1 https://github.com/Barman-Zarei/Brok /tmp/Brok
      - run: sudo apt-get update && sudo apt-get install -y shellcheck libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 python3-gi gir1.2-gtk-3.0 xvfb
      - run: shellcheck -S warning build/build-iso.sh installer/nx-install installer/nx-install-alongside installer/nx-install-alongside-mbr tests/vm/*.sh
      - run: xvfb-run -a python3 -m unittest discover -s tests/unit -p 'test_*.py'
      - run: python3 compatibility/validate.py
      - name: Windows tool on Python 3.8 + PySide2 5.15.2.1 (offscreen)
        run: |
          pip install uv pefile && uv venv --python 3.8 /tmp/v38 && uv pip install --python /tmp/v38/bin/python PySide2==5.15.2.1
          /tmp/v38/bin/python -m unittest tests.unit.test_nxverify tests.unit.test_gui_offscreen tests.unit.test_win7_check -v
  windows-build-test:
    needs: lint-unit
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix: { arch: [x64, x86] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.8', architecture: '${{ matrix.arch }}' }
      - run: python -m pip install --upgrade pip && pip install PySide2==5.15.2.1 pyinstaller==5.13.2 pefile
      - name: Unit tests on real Windows (Python 3.8)
        run: python -m unittest tests.unit.test_nxverify tests.unit.test_gui_offscreen tests.unit.test_win7_check -v
        env: { QT_QPA_PLATFORM: offscreen }
      - name: Build executables
        run: |
          pyinstaller --noconfirm --clean --onedir --name nx-media-tool-cli --paths windows/media-tool windows/media-tool/nxverify.py
          pyinstaller --noconfirm --clean --onedir --windowed --name nx-media-tool --paths windows/media-tool windows/media-tool/gui.py
      - name: Smoke test CLI exe (match and mismatch)
        shell: pwsh
        run: |
          python -c "import hashlib;open('t.iso','wb').write(b'hello');open('t.iso.sha256','w').write(hashlib.sha256(b'hello').hexdigest()+'  t.iso\n')"
          .\dist\nx-media-tool-cli\nx-media-tool-cli.exe t.iso t.iso.sha256
          if ($LASTEXITCODE -ne 0) { throw "cli verify failed" }
          python -c "open('bad.sha256','w').write('0'*64+'  t.iso\n')"
          .\dist\nx-media-tool-cli\nx-media-tool-cli.exe t.iso bad.sha256
          if ($LASTEXITCODE -ne 1) { throw "cli must report a mismatch with exit code 1" }
      - name: Smoke test GUI exe (headless self test)
        shell: pwsh
        run: |
          Start-Process -FilePath .\dist\nx-media-tool\nx-media-tool.exe -ArgumentList '--selftest','selftest.txt' -Wait -NoNewWindow
          if (-not (Test-Path selftest.txt)) { throw "self test marker missing" }
          if ((Get-Content selftest.txt) -ne 'selftest-ok') { throw "bad self test marker" }
      - name: Static Windows 7 compatibility check of every built binary
        run: python windows/check_win7_compat.py dist
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'win-${{ matrix.arch }}', path: dist/ }
  wine-win7-proxy:
    needs: windows-build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'win-*', path: art }
      - run: |
          sudo dpkg --add-architecture i386 && sudo apt-get update
          sudo apt-get install -y wine wine32:i386 xvfb
      - name: Run the built executables under Wine configured as Windows 7 (PROXY test)
        run: |
          export WINEDEBUG=-all WINEPREFIX=$HOME/wine7
          xvfb-run -a wine winecfg -v win7
          python3 -c "import hashlib;open('t.iso','wb').write(b'hello');open('t.iso.sha256','w').write(hashlib.sha256(b'hello').hexdigest()+'  t.iso\n')"
          for a in x64 x86; do
            out=$(xvfb-run -a wine art/win-$a/nx-media-tool-cli/nx-media-tool-cli.exe t.iso t.iso.sha256 | tr -d '\r'); echo "$a: $out"
            echo "$out" | grep -q '^OK' || { echo "wine $a CLI failed"; exit 1; }
            rm -f st.txt; xvfb-run -a wine art/win-$a/nx-media-tool/nx-media-tool.exe --selftest st.txt; sleep 2
            grep -q selftest-ok st.txt || { echo "wine $a GUI selftest failed"; exit 1; }
          done
  iso-and-installer-tests:
    needs: lint-unit
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env: { NX_BOOT_TIMEOUT: '1500' }
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap xorriso squashfs-tools grub-pc-bin grub-efi-amd64-bin grub-efi-amd64-signed shim-signed \
            mtools dosfstools parted gdisk ntfs-3g qemu-system-x86 ovmf
      - run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
      - name: Make dpkg non-interactive (keep existing conffiles, e.g. casper.conf)
        run: |
          sed -i 's/apt-get install -y /apt-get install -y -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold /' build/build-iso.sh
          grep -q 'force-confold' build/build-iso.sh
      - name: Build ISO
        run: sudo -E build/build-iso.sh
        env: { DEBIAN_FRONTEND: noninteractive, DEBCONF_NONINTERACTIVE_SEEN: "true" }
      - run: sudo chmod -R a+r out && (cd out && sha256sum -c *.sha256)
      - run: tests/vm/boot-test.sh out/nx-os-*-amd64.iso 1500 && tests/vm/boot-test-uefi.sh out/nx-os-*-amd64.iso 1500
      - name: Installer tests incl. MBR/BIOS alongside install (Windows 7 style disk)
        run: sudo NX_LOG_DIR=$PWD/test-logs tests/vm/test-installers.sh out/nx-os-*-amd64.iso all
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: nx-iso-and-logs, path: "out/\ntest-logs/" }
